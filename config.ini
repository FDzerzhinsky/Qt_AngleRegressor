# Конфигурация камеры
camera_ip = 192.168.101.10
host_ip = 192.168.101.201

# Параметры обработки изображений
max_captures = 0                # Максимальное количество захватов (0 = без ограничений)
ref_image_scale = 0.5           # Масштаб референсного изображения (0.0 - 1.0)
orb_max_features = 500          # Максимальное количество ORB-фич
orb_scale_factor = 1.2          # Масштабный фактор ORB пирамиды
orb_n_levels = 4                # Количество уровней ORB пирамиды
orb_edge_threshold = 20         # Порог границ ORB
orb_first_level = 0             # Первый уровень ORB пирамиды
orb_wta_k = 2                   # Количество точек для ORB WTA
orb_score_type = 1              # Тип оценки ORB (0=FAST, 1=HARRIS)
orb_patch_size = 31             # Размер патча ORB
orb_fast_threshold = 20         # Порог FAST для ORB
flann_search_params = 10        # Параметры поиска FLANN
good_match_ratio = 0.65         # Соотношение для фильтрации хороших совпадений
min_good_matches = 5            # Минимальное количество хороших совпадений
ransac_threshold = 3.0          # Порог RANSAC для гомографии